name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - feat/web-ui-demo
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Enable web
        run: flutter config --enable-web
      - name: Run tests
        run: flutter test --coverage
      - name: Build Web
        run: flutter build web --release --base-href "/aa/"
      - name: List build output
        run: |
          echo "Build directory contents:"
          ls -la build/web/
          echo "Checking for flutter.js:"
          find build/web/ -name "flutter.js" -o -name "main.dart.js"
      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="$FLUTTER_BASE_HREF">|<base href="/aa/">|g' build/web/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
