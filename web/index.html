<!DOCTYPE html>
<html>
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA斗地主</title>
  <style>
    body { margin: 0; background: #0B0B0F; color: #D4AF37; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .loader { text-align: center; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <h1>AA斗地主</h1>
    <p>加载中...</p>
  </div>
  <script>
    var serviceWorkerVersion = null;
    window.flutterConfiguration = {
      canvasKitBaseURL: "./canvaskit/"
    };
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({canvasKitBaseUrl: "./canvaskit/"}).then(function(appRunner) {
            document.getElementById('loader').style.display = 'none';
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter.js" defer></script>
</body>
</html>
