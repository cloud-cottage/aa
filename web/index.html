<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA斗地主 - AlleyAce</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: linear-gradient(135deg, #1A1A2E 0%, #0F0F1A 50%, #16213E 100%); color: #D4AF37; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    .loader { text-align: center; animation: fadeIn 1s ease-in; }
    .loader h1 { font-size: 3rem; margin: 0; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); animation: pulse 2s infinite; }
    .loader p { font-size: 1.2rem; margin: 1rem 0; opacity: 0.8; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <h1>AA斗地主</h1>
    <p>黑暗哥特写实风格 • NFT集成 • 智能AI对战</p>
    <p style="font-size: 0.9rem; opacity: 0.6;">加载中...</p>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        document.getElementById('loader').style.display = 'none';
        appRunner.runApp();
      });
    });
  </script>
</body>
</html>
