<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AA斗地主 - AlleyAce</title>
  <style>
    body { background: #0B0B0F; color: #fff; font-family: system-ui; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  </style>
</head>
<body>
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) { return; }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('flutter_service_worker.js?v=' + serviceWorkerVersion).then(function(reg) {
        function waitForActivation(serviceWorker) {
          serviceWorker.addEventListener('statechange', function() {
            if (serviceWorker.state == 'activated') { loadMainDartJs(); }
          });
        }
        if (reg.active) { loadMainDartJs(); }
        else { reg.addEventListener('updatefound', function() { waitForActivation(reg.installing); }); }
      }).catch(function(e) { console.error(e); });
    } else { loadMainDartJs(); }
  </script>
  <script src="flutter.js" defer></script>
</body>
</html>
